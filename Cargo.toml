[workspace]
resolver = "2"
members = [
    "crates/sip-core",
    "crates/sip-tx",
    "crates/sdp",
    "crates/rtp",
    "crates/codecs",
    "crates/b2bua",
    "crates/srtp",
    "crates/dtls",
    "crates/ice",
    "crates/sbc",
    "crates/media",
    "crates/dialer",
    "crates/ai-bridge",
    "crates/api",
    "crates/cdr",
    "crates/proxy",
    "crates/registrar",
    "crates/zrtc",
    "crates/observ",
    "crates/rfc3263",
    "crates/sctp",
    "crates/dialog",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Z.ai VoIP Engineering"]

[workspace.dependencies]
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tokio = { version = "1", features = ["full"] }
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["ws"] }
opus = "0.3"

sip-core = { path = "crates/sip-core" }
sip-tx = { path = "crates/sip-tx" }
sdp = { path = "crates/sdp" }
rtp = { path = "crates/rtp" }
codecs = { path = "crates/codecs" }
media = { path = "crates/media" }
dialer = { path = "crates/dialer" }
ai-bridge = { path = "crates/ai-bridge" }
cdr = { path = "crates/cdr" }
b2bua = { path = "crates/b2bua" }
srtp = { path = "crates/srtp" }
dtls = { path = "crates/dtls" }
ice = { path = "crates/ice" }
sbc = { path = "crates/sbc" }
proxy = { path = "crates/proxy" }
registrar = { path = "crates/registrar" }
observ = { path = "crates/observ" }
rfc3263 = { path = "crates/rfc3263" }
sctp = { path = "crates/sctp" }
dialog = { path = "crates/dialog" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
