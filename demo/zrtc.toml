# zrtc demo configuration — single daemon, full pipeline on loopback.
#
#   listeners (UDP/TCP/TLS/WSS) -> SBC -> proxy -> registrar/b2bua
#   b2bua media bridge -> loopback sink -> ai-bridge tap
#   REST API serves CDRs on :8080

[daemon]
log_level = "info"

[sip]
host = "127.0.0.1"
udp_port = 5060
tcp_port = 5060
tls_port = 5061
wss_port = 5063

[sbc]
allow = ["127.0.0.0/8", "::1/128"]
rate_per_second = 100.0
rate_burst = 200.0
topology_hiding = false

[registrar]
domain = "zrtc.local"
aor = "sip:1000@zrtc.local"
expires = 300

[b2bua]
port = 5070
media_host = "127.0.0.1"
routes = [
  { prefix = "1000", target = "sip:sink@127.0.0.1:5090" },
]
default_target = "sip:sink@127.0.0.1:5090"

[sink]
port = 5090

[outbound]
enabled = true
delay_ms = 3500
target = "sip:sink@127.0.0.1:5090"
rtp_ms = 1000

[ai_bridge]
enabled = true

[api]
port = 8080

[observ]
enabled = true
# /var/log/zrtc is the production default; the demo uses a writable dir.
log_dir = "/tmp/zrtc-observ"
log_level = "info"

[observ.pcap]
enabled = true
sip_file = "sip.pcap"
rtp_file = "rtp.pcap"
include_payload = true
max_file_mb = 512

[observ.trace]
enabled = true
include_sdp = true
include_sip_bodies = true
flush_interval_ms = 100
