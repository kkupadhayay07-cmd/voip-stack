# ZRTC VoIP stack — CI pipeline.
#
# Jobs: fmt-check, clippy, test, audit, fuzz-smoke, codec-interop (G.729 vs ffmpeg).
#
# STATE (see worklog / docs/COMPLIANCE.md):
# - The tree is rustfmt-clean and clippy-clean under `-D warnings`
#   (fmt + clippy gate every push).
# - Tests run PER CRATE sequentially (`cargo test --workspace` OOMs on
#   constrained runners); the `test` job below uses the workspace target on
#   GitHub runners (which have ample memory) but keeps per-crate invocations
#   for portability. `fuzz-smoke` runs the deterministic malformed-input
#   corpora (stable equivalent of the cargo-fuzz targets in fuzz/) — the fuzz
#   crate itself is its own workspace and only builds under nightly libFuzzer.
#
# System deps: `opus 0.3` binds the system libopus via pkg-config, so every
# job that compiles the workspace needs pkg-config + libopus-dev.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Intentionally NOT setting CARGO_TARGET_DIR here: GitHub runners have
  # plenty of disk and the default ./target layout keeps rust-cache effective.
  # (The shared /tmp/voip-target convention is a local-sandbox thing only.)

jobs:
  fmt-check:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps (libopus)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libopus-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (libopus)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libopus-dev
      - uses: Swatinem/rust-cache@v2
      # Per-crate, sequential: keeps the door open for memory-constrained
      # runners and gives per-crate timing in the log.
      - name: cargo test (per crate, sequential)
        run: |
          cargo test -p codecs
          cargo test -p sip-core
          cargo test -p sdp
          cargo test -p rtp
          cargo test -p b2bua

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        continue-on-error: false
        run: cargo audit
      # The one standing finding (RUSTSEC-2026-0150, audiopus_sys unmaintained)
      # is an informational warning that exits 0; see docs/SECURITY_NOTES.md.

  fuzz-smoke:
    name: fuzz smoke (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Deterministic malformed-input corpora against the same public parser
      # APIs the nightly libFuzzer targets exercise (see fuzz/README.md).
      # No libopus needed: these crates have no codec deps. Sequential.
      - name: sip-core corpus
        run: cargo test -p sip-core --test fuzz_smoke
      - name: sdp corpus
        run: cargo test -p sdp --test fuzz_smoke
      - name: rtp corpus (packets + DTMF)
        run: cargo test -p rtp --test fuzz_smoke

  codec-interop:
    name: G.729 interop (ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (libopus, ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libopus-dev ffmpeg
      - uses: Swatinem/rust-cache@v2
      # Golden vectors from bcg729 are committed under crates/codecs/tests/data;
      # the test additionally cross-decodes our encoder bitstream with ffmpeg
      # when available on PATH (runtime-detected).
      - name: cargo test -p codecs --test g729_interop
        run: cargo test -p codecs --test g729_interop
